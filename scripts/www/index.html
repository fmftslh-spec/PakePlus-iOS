<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小六壬排盘 - 简约高级风格</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        body {
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="background-effect"></div>
    <div id="particles-container"></div>

    <button class="theme-toggle" aria-label="切换主题">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
    </button>

    <div class="container">
        <div id="time-info" class="time-info"></div>

        <header class="header">
            <h1>小六壬排盘</h1>
            <p class="subtitle">以简约之形，探天地之理</p>
        </header>

        <div class="method-switch">
            <button class="method-btn active" data-method="date">时间起卦</button>
            <button class="method-btn" data-method="number">数字起卦</button>
        </div>

        <div class="input-section">
            <div id="date-method" class="input-content">
                <div class="input-group">
                    <label for="month-select">农历月份：</label>
                    <select id="month-select">
                        <option value="1">正月</option>
                        <option value="2">二月</option>
                        <option value="3">三月</option>
                        <option value="4">四月</option>
                        <option value="5">五月</option>
                        <option value="6">六月</option>
                        <option value="7">七月</option>
                        <option value="8">八月</option>
                        <option value="9">九月</option>
                        <option value="10">十月</option>
                        <option value="11">冬月</option>
                        <option value="12">腊月</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="day-select">农历日期：</label>
                    <select id="day-select"></select>
                </div>
                <div class="input-group">
                    <label for="hour-select">时辰：</label>
                    <select id="hour-select">
                        <option value="1">子</option>
                        <option value="2">丑</option>
                        <option value="3">寅</option>
                        <option value="4">卯</option>
                        <option value="5">辰</option>
                        <option value="6">巳</option>
                        <option value="7">午</option>
                        <option value="8">未</option>
                        <option value="9">申</option>
                        <option value="10">酉</option>
                        <option value="11">戌</option>
                        <option value="12">亥</option>
                    </select>
                </div>
            </div>

            <div id="number-method" class="input-content" style="display: none;">
                <div class="input-group">
                    <label for="number-1">月数</label>
                    <input type="number" id="number-1" min="1" max="12" value="1" maxlength="2">
                    <span class="num-display">→</span>
                    <span id="num-result-1">1</span>
                </div>
                <div class="input-group">
                    <label for="number-2">日数</label>
                    <input type="number" id="number-2" min="1" max="31" value="2" maxlength="2">
                    <span class="num-display">→</span>
                    <span id="num-result-2">2</span>
                </div>
                <div class="input-group">
                    <label for="number-3">时数</label>
                    <input type="number" id="number-3" min="1" max="12" value="3" maxlength="2">
                    <span class="num-display">→</span>
                    <span id="num-result-3">3</span>
                </div>
            </div>

            <div class="button-container">
                <button id="calculate-btn">开始排盘</button>
                <button id="current-time-btn" title="使用当前时间">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                </button>
                <button id="export-btn">导出结果</button>
            </div>
        </div>

        <h3 class="result-title">排盘结果</h3>
        <div class="main-grid-container">
            <div class="grid-container" id="grid-container"></div>
        </div>

        <div class="steps-section">
            <h2>起课步骤</h2>
            <div id="steps-display" class="steps-display"></div>
        </div>

        <div class="time-conversion">
            <h3>时辰对照表</h3>
            <div class="time-table">
                <div class="time-item"><span class="chinese-hour">子时</span><span class="time-range">23:00-00:59</span></div>
                <div class="time-item"><span class="chinese-hour">丑时</span><span class="time-range">01:00-02:59</span></div>
                <div class="time-item"><span class="chinese-hour">寅时</span><span class="time-range">03:00-04:59</span></div>
                <div class="time-item"><span class="chinese-hour">卯时</span><span class="time-range">05:00-06:59</span></div>
                <div class="time-item"><span class="chinese-hour">辰时</span><span class="time-range">07:00-08:59</span></div>
                <div class="time-item"><span class="chinese-hour">巳时</span><span class="time-range">09:00-10:59</span></div>
                <div class="time-item"><span class="chinese-hour">午时</span><span class="time-range">11:00-12:59</span></div>
                <div class="time-item"><span class="chinese-hour">未时</span><span class="time-range">13:00-14:59</span></div>
                <div class="time-item"><span class="chinese-hour">申时</span><span class="time-range">15:00-16:59</span></div>
                <div class="time-item"><span class="chinese-hour">酉时</span><span class="time-range">17:00-18:59</span></div>
                <div class="time-item"><span class="chinese-hour">戌时</span><span class="time-range">19:00-20:59</span></div>
                <div class="time-item"><span class="chinese-hour">亥时</span><span class="time-range">21:00-22:59</span></div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-header">
                <h3 class="history-title">历史记录</h3>
                <button class="clear-history">清除记录</button>
            </div>
            <div class="history-list" id="history-list"></div>
        </div>

        <div class="share-section">
            <p>分享当前卦象:</p>
            <a href="" class="share-link" id="share-link" target="_blank">复制链接</a>
        </div>
    </div>

    <div id="interpretation-modal" class="interpretation-modal">
        <div class="interpretation-content">
            <button class="close-modal">×</button>
            <h3 id="modal-god-name"></h3>
            <div class="basic-interpretation">
                <h4>基本解读</h4>
                <p id="modal-basic-interpretation"></p>
            </div>
            <div class="combination-interpretation">
                <h4>组合解读</h4>
                <div id="modal-combinations"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
